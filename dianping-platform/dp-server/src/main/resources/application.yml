server:
  port: 8080

spring:
  application:
    name: dianping-server
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除（参照《数据库ER图设计.md》约定：deleted tinyint(1)）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Phase 1 计划引入：
#   Knife4j（knife4j-openapi3-jakarta-spring-boot-starter）接口文档
#   RabbitMQ（spring-boot-starter-amqp）异步通知 / 延迟关单
#   Redisson 分布式锁（下单防超卖）
#   MinIO 对象存储（评价/商户图片上传）