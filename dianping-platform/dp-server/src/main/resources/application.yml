server:
  port: 8080

spring:
  application:
    name: dianping-server
  profiles:
    active: dev
  # 统一加载项目根目录 .env（KEY=VALUE），缺失时不影响启动
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  Jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除（参照《数据库ER图设计.md》约定：deleted tinyint(1)）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

